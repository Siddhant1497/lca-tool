</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Vertical (9:16) series engine for "The Carbon You Can't See".
// An episode is data: scenes (start phrase, transition, background plate, timed elements). Timings are narration

let W = 1080, H = 1920;
const CANVAS = document.getElementById("c");
let MAIN = CANVAS.getContext("2d"), ctx = MAIN, BUF_A, BUF_B;
let DATA = { total: 60, sentences: [], captions: [], spec: { scenes: [] } };
const IMG = {};
const ICONS = ["office", "host", "rock", "fire", "factory", "construction", "bolt", "brick", "globe", "airplane", "sun", "house",

function load(name, src) { return new Promise(res => { const im = new Image(); im.onload = res; im.onerror = res; im.src = src; IMG[name] = im; }); }

  const plates = new Set();
  for (const sc of DATA.spec.scenes) for (const p of [].concat(sc.plate || [])) plates.add(p.img);
  return Promise.all([...ICONS.map(n => load(n, `assets/${n}.svg`)), ...[...plates].map(n => load(n, `gen/${n}.png`))]);

// ── maths ──
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);

}
// a time spec: number = seconds after scene start, string = narration phrase, [phrase, offset] = phrase + offset
function at(v, s0, dflt = 0) {

  if (typeof v === "number") return s0 + v;

// ── drawing helpers ──

const COLORS = { amber: "#ff9d3d", orange: "#ff7a3d", red: "#e0465f", pink: "#ff8fa3", blue: "#4b7bff", violet: "#7b5ce6",

  ctx.fillStyle = rad(26, -5, 2, 18, [[0, "#ffa0ae"], [1, "#e0465f"]]); circle(26, 0, 15); ctx.fill();

// ── elements ──
const EL = {
  kinetic(e, t, s0) { kinetic(e.text, e.y ?? 420, e.size ?? 96, t, at(e.at, s0, 0.1), e.color || "#fff", e.until !== undefined ? at(e.until, s0) : undefined); },
  pill(e, t, s0) { const t0 = at(e.at, s0, 0.2), out = e.until !== undefined ? 1 - prog(t, at(e.until, s0), 0.3) : 1;

  art(e, t, s0) { art(e.icon, e.x ?? W / 2, e.y ?? 800, e.size ?? 260, t, at(e.at, s0, 0.2), { glow: e.glow, rot: e.rot, bob: e.bob, shadow: e.shadow,
    until: e.until !== undefined ? at(e.until, s0) : undefined }); },
  stat(e, t, s0) {
    const t0 = at(e.at, s0, 0.3), a = prog(t, t0, 0.45); if (a <= 0.01) return;

    ctx.font = "900 190px Inter"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; glow("rgba(255,180,60,0.6)", 40); ctx.fillStyle = col(e.color || "yellow"); ctx.fillText(v, 0, 0); noGlow();
    ctx.restore(); ctx.save(); ctx.globalAlpha = clamp(a * 2.5);
    const lines = wrapWords(e.caption || "", "700 42px Inter", W - 260); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y + 60 + i * 52));
    if (e.source) { ctx.font = "500 28px Inter"; ctx.fillStyle = "rgba(255,255,255,0.65)"; ctx.fillText("Source: " + e.source, W / 2, y + 70 + lines.length * 52 + 14); }

  donut(e, t, s0) {

    ctx.save(); ctx.globalAlpha = clamp(a * 2.5); ctx.fillStyle = "rgba(16,10,50,0.7)"; circle(cx, cy, R + 70); ctx.fill();

    if (e.source) { ctx.font = "500 26px Inter"; ctx.fillStyle = "rgba(255,255,255,0.65)"; ctx.fillText("Source: " + e.source, cx, cy + R + 110); }

  bars(e, t, s0) {

  },
  chain(e, t, s0) {

    e.items.forEach((it, i) => { const t0 = at(it.at, s0, 0.3 + i), x = gap * (i + 0.5);
